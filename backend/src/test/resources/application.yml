spring:
  datasource:
    url: jdbc:h2:mem:charcreate;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  start-level:
    default: 8
    vocation-none: 1
  max-characters-per-account: 10
  cors-origin: http://localhost:5173

logging:
  level:
    root: WARN
    org.flywaydb: INFO

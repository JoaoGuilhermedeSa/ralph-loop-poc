spring:
  application:
    name: charcreate
  datasource:
    url: jdbc:mysql://localhost:3306/charcreate?useSSL=false&allowPublicKeyRetrieval=true
    username: charcreate
    password: charcreate
  jpa:
    hibernate:
      ddl-auto: validate      # Flyway owns the schema. See specs/05-schema.md.
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  start-level:
    default: 8
    vocation-none: 1
  max-characters-per-account: 10
  cors-origin: http://localhost:5173

server:
  port: 8080
